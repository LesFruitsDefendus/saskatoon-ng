# See https://docs.astral.sh/ruff/settings/ for available settings

line-length = 99

# Local packages (harvest, member, sitebase, saskatoon) live under ./saskatoon
src = [".", "saskatoon"]

[format]
# Leave all quotes unchanged
quote-style = "preserve"
exclude = [
    "venv/*",
    "**/migrations/*",
]

[lint]
exclude = [
    "venv/*",
    "**/migrations/*",
]

[lint.isort]
combine-as-imports = true
