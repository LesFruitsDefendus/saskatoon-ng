{% extends 'app/forms/base.html' %}
{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

{% block form %}

    {% block header %}
    {% endblock header %}

    <form method="post">
        {% csrf_token %}
        <div class="modelForm">
            {{ form|crispy }}
        </div>
        <button type="submit" class="btn btn-primary notika-btn-primary">
        {% if save is not None %}{{ save }}{% else %}{% translate 'Save' %}{% endif %}
        </button>
        {% if cancel_url %}
            <a href="{{ cancel_url }}" class="btn btn-warning notika-btn-warning" style="margin-left:1rem;">
                {% translate 'Cancel' %}
            </a>
        {% endif %}
    </form>

{% endblock form %}
