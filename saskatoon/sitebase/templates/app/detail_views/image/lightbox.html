{% load i18n %}
{% load static %}

<div class="modal fade" id="photoLightboxModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-body text-center">
                <button type="button" class="close close-btn" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true" style="font-size: 28px;">&times;</span>
                </button>

                <div id="lightboxCarousel" class="carousel slide" data-ride="carousel" data-interval="false" tabindex="0">
                    <div class="carousel-inner" role="listbox">
                        {% for img in images %}
                            <div class="item {% if forloop.first %}active{% endif %}">
                                <img src="{{ img.image }}" class=" lightbox-image" alt="{% trans 'Enlarged property photo' %}">
                            </div>
                        {% endfor %}
                    </div>

                    <a class="left carousel-control" href="#lightboxCarousel" role="button" data-slide="prev">
                        <i class="fa fa-chevron-left"></i>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="right carousel-control" href="#lightboxCarousel" role="button" data-slide="next">
                        <i class="fa fa-chevron-right"></i>
                        <span class="sr-only">Next</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
