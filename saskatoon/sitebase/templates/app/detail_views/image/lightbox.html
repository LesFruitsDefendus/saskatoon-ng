{% load i18n %}

<div class="modal fade" id="photoLightboxModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document" style="width: auto; max-width: 90%; margin: 30px auto;">
        <div class="modal-content" style="background: rgba(0,0,0,0.85); border: none; box-shadow: none;">
            <div class="modal-body text-center" style="position: relative; padding: 15px;">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="position: absolute; right: 15px; top: 15px; z-index: 1050; color: #fff; opacity: 1; text-shadow: 0 1px 2px #000;">
                    <span aria-hidden="true" style="font-size: 28px;">&times;</span>
                </button>

                <!-- Lightbox Inner Carousel -->
                <div id="lightboxCarousel" class="carousel slide" data-ride="carousel" data-interval="false" tabindex="0">
                    <div class="carousel-inner" role="listbox">
                        {% for img in images %}
                            <div class="item {% if forloop.first %}active{% endif %}">
                                <img src="{{ img.image }}" class="img-responsive center-block" alt="{% trans 'Enlarged property photo' %}" style="max-height: 80vh; max-width: 100%; border-radius: 4px;">
                            </div>
                        {% endfor %}
                    </div>

                    <!-- Carousel Controls -->
                    <a class="left carousel-control" href="#lightboxCarousel" role="button" data-slide="prev" style="background: none; width: 10%;">
                        <i class="fa fa-chevron-left" style="color: #fff; text-shadow: 0 1px 2px #000; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"></i>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="right carousel-control" href="#lightboxCarousel" role="button" data-slide="next" style="background: none; width: 10%;">
                        <i class="fa fa-chevron-right" style="color: #fff; text-shadow: 0 1px 2px #000; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"></i>
                        <span class="sr-only">Next</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
