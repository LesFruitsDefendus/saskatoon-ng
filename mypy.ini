[mypy]
check_untyped_defs = False
disallow_untyped_defs=False
disallow_untyped_calls = False
disallow_incomplete_defs=False
warn_return_any=False
follow_untyped_imports = True
disallow_any_generics=True
namespace_packages=True
no_implicit_optional=True
show_error_codes=True
warn_no_return=True
warn_redundant_casts=True
warn_unreachable=True
warn_unused_configs=True
warn_unused_ignores=True
strict_equality=True
extra_checks=True
disallow_untyped_decorators=True
disallow_subclassing_any=True
enable_error_code = redundant-expr, possibly-undefined, deprecated, ignore-without-code, redundant-self, truthy-bool

exclude = saskatoon/(harvest|member|sitebase|saskatoon)/migrations

mypy_path = ./saskatoon
plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main,
    deal.mypy,

[mypy.plugins.django-stubs]
django_settings_module = "saskatoon.settings"