[tox]
minversion=3.20.1
requires=
    virtualenv>=20.0.35
envlist =
    mypy,pytype,ruff_check,ruff_imports_check

[testenv]

[testenv:test]
description = Test saskatoon

extras =
    test

allowlist_externals =
    {toxinidir}/saskatoon/tests/runtests.sh

commands = {toxinidir}/saskatoon/tests/runtests.sh

[testenv:ruff_format]
description = Run ruff on the saskatoon code

skip_install = true
deps = ruff

commands =
    ruff format ./saskatoon/

[testenv:ruff_check]
description = Check ruff formatting on saskatoon code

skip_install = true
deps = ruff

commands =
    ruff format --check ./saskatoon/

[testenv:ruff_imports]
description = Sort imports and remove unused ones in saskatoon code

skip_install = true
deps = ruff

commands =
    ruff check --select I,F401 --fix ./saskatoon/

[testenv:ruff_imports_check]
description = Check for unsorted or unused imports in saskatoon code

skip_install = true
deps = ruff

commands =
    ruff check --select I,F401 ./saskatoon/

[testenv:djlint]
description = Run djlint on the saskatoon code

skip_install = true
deps = djlint

commands =
    djlint ./saskatoon/sitebase/templates --lint --profile=django

[testenv:css-beautify]
description = Run css-beautify on .css files

skip_install = true
deps = cssbeautifier

commands =
    css-beautify -rn --space-around-combinator ./saskatoon/**/static/css/*.css

[testenv:mypy]
description = Run mypy (static type checker) on the saskatoon code

extras =
    test

deps =
    mypy>=0.8
    typing-extensions

commands =
    mypy --cache-dir="{toxworkdir}/mypy_cache" ./saskatoon

[testenv:pytype]
description = Run pytype (another static type checker) on the saskatoon code

deps =
    pytype
    .[test]

commands =
    pytype --keep-going --config=./pytype.toml

[testenv:apidocs]

deps =
    pydoctor

commands =
    # Run pydoctor build
    pydoctor \
        --project-name=Saskatoon-Dev \
        --project-url=https://github.com/LesFruitsDefendus/saskatoon-ng \
        --html-viewsource-base=https://github.com/LesFruitsDefendus/saskatoon-ng/tree/develop \
        --make-html \
        --html-output=./apidocs \
        --project-base-dir="{toxinidir}" \
        --docformat=restructuredtext \
        --intersphinx=https://docs.python.org/3/objects.inv \
        {toxinidir}/saskatoon/sitebase \
        {toxinidir}/saskatoon/harvest \
        {toxinidir}/saskatoon/member \
        {toxinidir}/saskatoon/saskatoon \
        {toxinidir}/saskatoon/tests

[testenv:checks]

extras =
    test
allowlist_externals =
    */manage.py
commands =
    {toxinidir}/saskatoon/manage.py check
    {toxinidir}/saskatoon/manage.py validate_templates

[testenv:unittests]

allowlist_externals =
    pytest
commands =
    pytest {toxinidir}/saskatoon/unittests -s -vv

[testenv:baselines]

allowlist_externals =
    pytest
setenv =
    SASKATOON_UPDATE_BASELINES=True
commands =
    pytest {toxinidir}/saskatoon/unittests/test_serializers.py
